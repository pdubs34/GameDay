name: GameDay
options:
  bundleIdPrefix: com.pdubs34
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L2W3C9UDP2
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  GameDay:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GameDay
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCalendarsFullAccessUsageDescription: GameDay adds your teams' games to a calendar and keeps their times up to date.
        NSCalendarsWriteOnlyAccessUsageDescription: GameDay adds games you pick to your calendar.
        CFBundleURLTypes:
          - CFBundleURLName: com.pdubs34.GameDay
            CFBundleURLSchemes: [gameday]
    entitlements:
      path: App/GameDay.entitlements
      properties:
        com.apple.security.application-groups: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdubs34.GameDay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: GameDayWidget
  GameDayWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: GameDay
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/GameDayWidget.entitlements
      properties:
        com.apple.security.application-groups: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdubs34.GameDay.Widget
